<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f9f9f9; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #fff; border: 2px solid #000; border-radius: 12px; padding: 20px; }
        .nav-links { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .nav-links a { text-decoration: none; color: #000; padding: 6px 16px; border: 2px solid #000; border-radius: 20px; font-weight: bold; }
        .nav-links a.active, .nav-links a:hover { background-color: #000; color: #fff; }
        h2 { margin: 15px 0 10px; border-bottom: 2px solid #000; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .btn-delete { background: #d32f2f; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .btn-status { background: #2e7d32; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-links">
            <a href="index.html">Menu</a>
            <a href="cart.html">Cart</a>
            <a href="owner.html">Owner View</a>
            <a href="admin.html" class="active">Admin Panel</a>
        </nav>

        <h1>Admin Control Panel</h1>

        <h2>Manage Menu Items</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminFoodTable"></tbody>
        </table>

        <h2>Manage Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Total Price</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminOrderTable"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ မိမိတို့၏ Firebase Config ဖြင့် အစားထိုးပါ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Manage Foods
        onValue(ref(db, 'foods'), (snapshot) => {
            const tbody = document.getElementById('adminFoodTable');
            tbody.innerHTML = '';
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.name}</td>
                            <td>${item.category}</td>
                            <td>$${parseFloat(item.price).toFixed(2)}</td>
                            <td><button class="btn-delete" onclick="deleteFood('${id}')">Delete</button></td>
                        </tr>
                    `;
                });
            }
        });

        // Manage Orders
        onValue(ref(db, 'orders'), (snapshot) => {
            const tbody = document.getElementById('adminOrderTable');
            tbody.innerHTML = '';
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const order = data[id];
                    tbody.innerHTML += `
                        <tr>
                            <td>...${id.slice(-5)}</td>
                            <td>$${order.totalPrice.toFixed(2)}</td>
                            <td>${order.status}</td>
                            <td>
                                <button class="btn-status" onclick="markCompleted('${id}')">Mark Completed</button>
                                <button class="btn-delete" onclick="deleteOrder('${id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            }
        });

        // Global Action Functions
        window.deleteFood = (id) => remove(ref(db, `foods/${id}`));
        window.deleteOrder = (id) => remove(ref(db, `orders/${id}`));
        window.markCompleted = (id) => update(ref(db, `orders/${id}`), { status: 'Completed' });
    </script>
</body>
</html>
