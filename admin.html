<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Live Orders</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff5722;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #777777;
            --border-color: #e0e0e0;
            --pending-color: #ff9800;
            --cooking-color: #2196f3;
            --completed-color: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            font-size: 24px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Analytics Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card .info h3 {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .stat-card .info p {
            font-size: 22px;
            font-weight: bold;
        }

        .stat-card .icon {
            font-size: 32px;
            color: var(--primary);
            opacity: 0.8;
        }

        /* Live Orders Section */
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* Order Card Style */
        .order-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border-left: 5px solid var(--pending-color);
            transition: transform 0.2s ease;
        }

        .order-card:hover {
            transform: translateY(-3px);
        }

        .order-card.cooking {
            border-left-color: var(--cooking-color);
        }

        .order-card.completed {
            border-left-color: var(--completed-color);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-badge {
            background-color: var(--primary);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .order-time {
            font-size: 12px;
            color: var(--text-light);
        }

        .order-items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .order-items-table td {
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px dashed #eee;
        }

        .order-items-table td:last-child {
            text-align: right;
            font-weight: 500;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .status-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            background-color: #fff;
        }
    </style>

    <!-- Firebase SDK (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-utensils"></i> Order Management Admin</h1>
            <span style="font-size: 14px; color: var(--text-light);">Realtime Dashboard</span>
        </header>

        <!-- Analytics Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="info">
                    <h3>စုစုပေါင်း အော်ဒါ</h3>
                    <p id="totalOrdersCount">0</p>
                </div>
                <div class="icon"><i class="fa-solid fa-receipt"></i></div>
            </div>
            <div class="stat-card">
                <div class="info">
                    <h3>စောင့်ဆိုင်းဆဲ အော်ဒါ (Pending)</h3>
                    <p id="pendingOrdersCount">0</p>
                </div>
                <div class="icon" style="color: var(--pending-color);"><i class="fa-solid fa-hourglass-half"></i></div>
            </div>
            <div class="stat-card">
                <div class="info">
                    <h3>စုစုပေါင်း ဝင်ငွေ</h3>
                    <p id="totalRevenueAmount">0 MMK</p>
                </div>
                <div class="icon" style="color: var(--completed-color);"><i class="fa-solid fa-money-bill-wave"></i></div>
            </div>
        </div>

        <!-- Live Orders Container -->
        <h2 class="section-title"><i class="fa-solid fa-bell"></i> လက်ရှိ ပြင်ဆင်ရန် အော်ဒါများ</h2>
        <div id="liveOrdersList" class="orders-grid">
            <p style="text-align: center; color: var(--text-light); grid-column: 1/-1;">အော်ဒါများ ရယူနေပါသည်...</p>
        </div>
    </div>

    <script>
        // 1. Firebase Configuration (သင့် Project ရဲ့ Configuration ဖြင့် အစားထိုးပါ)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Stats များကို UI တွင် Update လုပ်ပေးသော Function
        function updateStats(totalOrders, pendingOrders, totalRevenue) {
            document.getElementById('totalOrdersCount').innerText = totalOrders;
            document.getElementById('pendingOrdersCount').innerText = pendingOrders;
            document.getElementById('totalRevenueAmount').innerText = `${totalRevenue.toLocaleString()} MMK`;
        }

        // 3. Status ပြောင်းလဲရန် Function
        function updateOrderStatus(orderId, newStatus) {
            db.collection("orders").doc(orderId).update({
                status: newStatus
            }).then(() => {
                console.log(`Order ${orderId} updated to ${newStatus}`);
            }).catch(error => {
                console.error("Error updating status: ", error);
                alert("Status ပြောင်းလဲရာတွင် အမှားအယွင်းရှိပါသည်");
            });
        }

        // 4. Fetch Realtime Orders & Update Dashboard
        db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            const liveOrdersList = document.getElementById('liveOrdersList');
            
            let totalOrders = 0;
            let pendingOrders = 0;
            let totalRevenue = 0;
            let activeOrdersCount = 0;

            if (snapshot.empty) {
                liveOrdersList.innerHTML = `<p style="text-align: center; color: var(--text-light); grid-column: 1/-1;">လက်ရှိ ရောက်ရှိလာသော အော်ဒါများ မရှိသေးပါ...</p>`;
                updateStats(0, 0, 0);
                return;
            }

            liveOrdersList.innerHTML = "";

            snapshot.forEach(doc => {
                const order = doc.data();
                
                // Analytics စာရင်းအတွက် အော်ဒါအားလုံးကို တွက်ချက်မည် (Completed ပါဝင်သည်)
                totalOrders++;
                if (order.status === 'Pending') pendingOrders++;
                totalRevenue += (order.total || 0);

                // Completed ဖြစ်သွားပါက Live Orders UI List တွင် မပြဘဲ ကျော်သွားမည်
                if (order.status === 'Completed') {
                    return;
                }

                activeOrdersCount++;

                const orderStatusClass = (order.status || 'Pending').toLowerCase();
                const formattedTime = order.timestamp ? new Date(order.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now';

                let itemsHtml = '';
                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(i => {
                        itemsHtml += `
                            <tr>
                                <td>${i.name} x ${i.quantity}</td>
                                <td>${(i.price * i.quantity).toLocaleString()} MMK</td>
                            </tr>
                        `;
                    });
                }

                liveOrdersList.innerHTML += `
                    <div class="order-card ${orderStatusClass}">
                        <div class="order-header">
                            <span class="table-badge">Table ${order.table}</span>
                            <span class="order-time"><i class="fa-regular fa-clock"></i> ${formattedTime}</span>
                        </div>

                        <table class="order-items-table">
                            ${itemsHtml}
                        </table>

                        <div style="font-size: 12px; color: var(--text-light); margin-bottom: 8px;">
                            Payment: <strong>${order.paymentMethod || 'Cash'}</strong>
                        </div>

                        <div class="order-footer">
                            <div>
                                <small style="display:block; color:var(--text-light); font-size:11px;">စုစုပေါင်း</small>
                                <strong style="color:var(--primary); font-size:16px;">${Number(order.total).toLocaleString()} MMK</strong>
                            </div>
                            <div>
                                <select class="status-select" onchange="updateOrderStatus('${doc.id}', this.value)">
                                    <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                                    <option value="Cooking" ${order.status === 'Cooking' ? 'selected' : ''}>🍳 Cooking</option>
                                    <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Live Order မရှိပါက ပြသမည့် စာတမ်း
            if (activeOrdersCount === 0) {
                liveOrdersList.innerHTML = `<p style="text-align: center; color: var(--text-light); grid-column: 1/-1;">လက်ရှိ ပြင်ဆင်ရန် အော်ဒါများ မရှိသေးပါ...</p>`;
            }

            // Stat Cards အချက်အလက်များ Update လုပ်မည်
            updateStats(totalOrders, pendingOrders, totalRevenue);
        });
    </script>
</body>
</html>
