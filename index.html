<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Smart Restaurant</title>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8f9fa; padding: 15px; padding-bottom: 80px; }
        .header { background: #2f3542; color: white; text-align: center; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .table-badge { background: #ff4757; color: white; padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .menu-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .menu-card img { width: 100%; height: 120px; object-fit: cover; }
        .menu-details { padding: 12px; }
        .menu-title { font-size: 15px; font-weight: bold; color: #2f3542; margin-bottom: 5px; }
        .menu-price { color: #ff4757; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .add-btn { width: 100%; background: #2ed573; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .add-btn:active { background: #26af5f; }

        /* Floating Cart Bar */
        .cart-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: #1e90ff; color: white; padding: 12px 20px; border-radius: 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Smart Restaurant</h1>
        <p style="margin-top: 5px;">Table Number: <span id="tableNoBadge" class="table-badge">1</span></p>
    </div>

    <!-- Menu Grid Area -->
    <div class="menu-grid" id="menuGrid">
        <p style="grid-column: 1/-1; text-align: center; color: #777;">Loading menu items...</p>
    </div>

    <!-- Floating Cart View Button -->
    <a href="#" id="viewCartBtn" class="cart-bar">
        <span>🛒 View Cart (<span id="cartCount">0</span>)</span>
        <span id="cartTotal">0 MMK →</span>
    </a>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAV_3fSOQDigao1MDeZ12V734yqqHBKSDw",
            authDomain: "smart-restaurant-85871.firebaseapp.com",
            projectId: "smart-restaurant-85871",
            storageBucket: "smart-restaurant-85871.firebasestorage.app",
            messagingSenderId: "909399970300",
            appId: "1:909399970300:web:8da6c6522af7b1a6296279"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get Table Number from URL (e.g. index.html?table=5)
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table') || "1";
        document.getElementById('tableNoBadge').innerText = tableNumber;
        document.getElementById('viewCartBtn').href = `cart.html?table=${tableNumber}`;

        let cart = JSON.parse(localStorage.getItem('restaurant_cart')) || [];
        updateCartBar();

        // Real-Time Menu Sync from Firestore
        db.collection("menu").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = "";

            if (snapshot.empty) {
                menuGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #777;">No menu items available right now.</p>`;
                return;
            }

            snapshot.forEach(doc => {
                const item = doc.data();
                const defaultImg = "https://via.placeholder.com/150?text=Food";

                menuGrid.innerHTML += `
                    <div class="menu-card">
                        <img src="${item.image || defaultImg}" alt="${item.name}" onerror="this.src='${defaultImg}'">
                        <div class="menu-details">
                            <div class="menu-title">${item.name}</div>
                            <div class="menu-price">${Number(item.price).toLocaleString()} MMK</div>
                            <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ Add</button>
                        </div>
                    </div>
                `;
            });
        });

        function addToCart(name, price) {
            const existingIndex = cart.findIndex(i => i.name === name);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }
            localStorage.setItem('restaurant_cart', JSON.stringify(cart));
            updateCartBar();
        }

        function updateCartBar() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            document.getElementById('cartCount').innerText = totalItems;
            document.getElementById('cartTotal').innerText = `${totalPrice.toLocaleString()} MMK →`;
        }
    </script>
</body>
</html>
