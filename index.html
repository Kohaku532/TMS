<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Food Ordering</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f9f9f9; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: #fff; border: 2px solid #000; border-radius: 12px; padding: 20px; }
        .nav-links { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .nav-links a { text-decoration: none; color: #000; padding: 6px 16px; border: 2px solid #000; border-radius: 20px; font-weight: bold; }
        .nav-links a.active, .nav-links a:hover { background-color: #000; color: #fff; }
        h1 { text-align: center; margin-bottom: 20px; }
        .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .food-card { border: 2px solid #000; border-radius: 8px; padding: 12px; text-align: center; }
        .food-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .food-card h3 { margin: 8px 0; }
        .food-card .price { font-weight: bold; color: #2e7d32; margin-bottom: 8px; }
        .add-cart-btn { background: #000; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-links">
            <a href="index.html" class="active">Menu</a>
            <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
            <a href="owner.html">Owner View</a>
            <a href="admin.html">Admin Panel</a>
        </nav>

        <h1>Food Menu</h1>
        <div class="food-grid" id="foodContainer">
            <p style="text-align: center; grid-column: 1/-1;">Loading menu...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ မိမိတို့၏ Firebase Config ဖြင့် အစားထိုးပါ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Cart Count Update
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }
        updateCartCount();

        // Menu Data ဖတ်ခြင်း
        const foodsRef = ref(db, 'foods');
        onValue(foodsRef, (snapshot) => {
            const container = document.getElementById('foodContainer');
            container.innerHTML = '';
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const food = data[id];
                    const card = document.createElement('div');
                    card.className = 'food-card';
                    card.innerHTML = `
                        <img src="${food.image}" onerror="this.src='https://via.placeholder.com/150'">
                        <h3>${food.name}</h3>
                        <p style="color:#666; font-size:12px;">${food.category}</p>
                        <div class="price">$${parseFloat(food.price).toFixed(2)}</div>
                        <button class="add-cart-btn" onclick="addToCart('${id}', '${food.name}', ${food.price})">Add to Cart</button>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No food items available.</p>';
            }
        });

        // Add to Cart
        window.addToCart = (id, name, price) => {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ id, name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert(`${name} added to cart!`);
        };
    </script>
</body>
</html>
