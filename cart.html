<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Food Ordering</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f9f9f9; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; background: #fff; border: 2px solid #000; border-radius: 12px; padding: 20px; }
        .nav-links { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .nav-links a { text-decoration: none; color: #000; padding: 6px 16px; border: 2px solid #000; border-radius: 20px; font-weight: bold; }
        .nav-links a.active, .nav-links a:hover { background-color: #000; color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border-bottom: 1px solid #ccc; padding: 10px; text-align: left; }
        .checkout-btn { width: 100%; padding: 12px; background: #000; color: #fff; border: none; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .total-box { font-size: 18px; font-weight: bold; text-align: right; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-links">
            <a href="index.html">Menu</a>
            <a href="cart.html" class="active">Cart</a>
            <a href="owner.html">Owner View</a>
            <a href="admin.html">Admin Panel</a>
        </nav>

        <h1 style="text-align: center; margin-bottom: 15px;">Your Cart</h1>
        <table>
            <thead>
                <tr>
                    <th>Food Item</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>

        <div class="total-box">Total: $<span id="totalAmount">0.00</span></div>
        <button class="checkout-btn" id="checkoutBtn">Place Order</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ မိမိတို့၏ Firebase Config ဖြင့် အစားထိုးပါ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const tbody = document.getElementById('cartTable');
            let total = 0;
            tbody.innerHTML = '';

            if (cart.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Cart is empty.</td></tr>';
            } else {
                cart.forEach((item, index) => {
                    total += parseFloat(item.price);
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.name}</td>
                            <td>$${parseFloat(item.price).toFixed(2)}</td>
                            <td><button onclick="removeItem(${index})">Remove</button></td>
                        </tr>
                    `;
                });
            }
            document.getElementById('totalAmount').innerText = total.toFixed(2);
        }

        window.removeItem = (index) => {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        };

        document.getElementById('checkoutBtn').addEventListener('click', () => {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert(" Cart ထဲမှာ ပစ္စည်းမရှိပါ။");
                return;
            }

            const total = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
            const ordersRef = ref(db, 'orders');

            push(ordersRef, {
                items: cart,
                totalPrice: total,
                status: 'Pending',
                orderDate: new Date().toISOString()
            }).then(() => {
                alert("Order တင်ခြင်း အောင်မြင်ပါသည်။");
                localStorage.removeItem('cart');
                renderCart();
            });
        });

        renderCart();
    </script>
</body>
</html>
