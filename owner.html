<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Smart Restaurant</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f1f2f6; padding: 20px; }
        .dashboard { max-width: 900px; margin: 0 auto; }
        header { background: #2f3542; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        
        /* Stats Dashboard Section */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { color: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .stat-card small { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .stat-card h2 { font-size: 28px; margin-top: 8px; }

        .card-total { background: linear-gradient(135deg, #1e90ff, #3742fa); }
        .card-daily { background: linear-gradient(135deg, #2ed573, #26af5f); }
        .card-sales { background: linear-gradient(135deg, #ffa502, #ff7f50); }

        .date-picker-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .date-picker-box input { padding: 8px 12px; border-radius: 6px; border: 1px solid #ced6e0; outline: none; font-weight: bold; color: #2f3542; }

        .section-box { background: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size: 18px; color: #2f3542; margin-bottom: 15px; border-bottom: 2px solid #f1f2f6; padding-bottom: 8px; }

        .order-card { background: #f8f9fa; border: 1px solid #eccc68; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; font-weight: bold; }
        .order-items { margin-bottom: 10px; font-size: 14px; color: #57606f; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #2f3542; }
        
        .time-badge { background: #70a1ff; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .payment-badge { background: #ffa502; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-left: 5px; }
        .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-left: 5px; font-weight: bold; }
        .status-pending { background: #ff7f50; color: white; }
        .status-finished { background: #2ed573; color: white; }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>Owner Dashboard</h1>
    </header>

    <div class="date-picker-box">
        <label for="salesDate"><strong>📅 Select Date for Daily View:</strong></label>
        <input type="date" id="salesDate" onchange="filterSalesByDate()">
    </div>

    <div class="stats-grid">
        <div class="stat-card card-total">
            <small>💰 Total Income (All Time)</small>
            <h2 id="totalIncome">0 MMK</h2>
        </div>

        <div class="stat-card card-daily">
            <small>📅 Daily Income</small>
            <h2 id="dailyIncome">0 MMK</h2>
        </div>

        <div class="stat-card card-sales">
            <small>🛒 Daily Sales (Orders Count)</small>
            <h2 id="dailySalesCount">0 Orders</h2>
        </div>
    </div>

    <div class="section-box">
        <h2 class="section-title">🛒 Orders History (<span id="displayDateLabel">Today</span>)</h2>
        <div id="ordersContainer">
            <p style="text-align: center; color: #777;">Loading sales data...</p>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAV_3fSOQDigao1MDeZ12V734yqqHBKSDw",
        authDomain: "smart-restaurant-85871.firebaseapp.com",
        projectId: "smart-restaurant-85871",
        storageBucket: "smart-restaurant-85871.firebasestorage.app",
        messagingSenderId: "909399970300",
        appId: "1:909399970300:web:8da6c6522af7b1a6296279"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ordersContainer = document.getElementById('ordersContainer');
    const totalIncomeElement = document.getElementById('totalIncome');
    const dailyIncomeElement = document.getElementById('dailyIncome');
    const dailySalesCountElement = document.getElementById('dailySalesCount');
    const salesDateInput = document.getElementById('salesDate');
    const displayDateLabel = document.getElementById('displayDateLabel');

    let allOrders = [];

    // Set default date to Today
    const today = new Date();
    salesDateInput.value = today.toISOString().split('T')[0];

    // Read All Orders Realtime (Includes Finished & Pending Orders)
    db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        allOrders = [];
        let grandTotalRevenue = 0;

        snapshot.forEach(doc => {
            const orderData = doc.data();
            allOrders.push(orderData);

            // Calculate Overall Total Income for all time
            const orderTotal = Number(orderData.total || 0);
            grandTotalRevenue += orderTotal;
        });

        // Display Overall Total
