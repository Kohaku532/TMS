<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner View</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 750px; background-color: #ffffff; border: 2px solid #000; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .nav-links { display: flex; gap: 10px; justify-content: center; }
        .nav-links a { text-decoration: none; color: #000; padding: 6px 16px; border: 2px solid #000; border-radius: 20px; font-weight: bold; }
        .nav-links a.active, .nav-links a:hover { background-color: #000; color: #fff; }
        .header-box, .income-box { border: 2px solid #000; border-radius: 30px; padding: 12px; text-align: center; font-size: 20px; font-weight: bold; background-color: #fff; }
        .add-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .add-form input { flex: 1; min-width: 100px; border: 2px solid #000; border-radius: 4px; padding: 8px; font-size: 14px; outline: none; }
        .add-btn { border: 2px solid #000; border-radius: 20px; padding: 8px 18px; background-color: #fff; font-weight: bold; cursor: pointer; }
        .food-display { border: 2px solid #000; min-height: 180px; max-height: 250px; overflow-y: auto; padding: 12px; border-radius: 4px; background-color: #fff; }
        .menu-table { width: 100%; border-collapse: collapse; text-align: left; }
        .menu-table th, .menu-table td { padding: 8px; border-bottom: 1px solid #ddd; }
        .menu-table img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        .daily-controls { display: flex; gap: 12px; align-items: center; }
        .daily-income-btn { border: 2px solid #000; padding: 10px 16px; border-radius: 4px; background-color: #fff; font-weight: bold; cursor: pointer; }
        .date-box { flex: 1; border: 2px solid #000; border-radius: 30px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
        .date-box input[type="date"] { border: none; outline: none; font-size: 14px; background: transparent; cursor: pointer; }
        .daily-order-box { border: 2px solid #000; min-height: 120px; max-height: 200px; overflow-y: auto; border-radius: 4px; padding: 12px; background-color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-links">
            <a href="index.html">Menu</a>
            <a href="cart.html">Cart</a>
            <a href="owner.html" class="active">Owner View</a>
            <a href="admin.html">Admin Panel</a>
        </nav>

        <div class="header-box">Owner View</div>
        <div class="income-box" id="totalIncomeDisplay">Total income: $0.00</div>

        <!-- Add Food Form -->
        <form class="add-form" id="addFoodForm">
            <input type="text" id="foodName" placeholder="food" required>
            <input type="number" id="foodPrice" placeholder="price" step="0.01" required>
            <input type="text" id="foodCategory" placeholder="categori" required>
            <input type="text" id="foodImage" placeholder="image (URL)">
            <button type="submit" class="add-btn">+Add</button>
        </form>

        <!-- Main Display Box -->
        <div class="food-display">
            <table class="menu-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Food</th>
                        <th>Category</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="menuTableBody"></tbody>
            </table>
        </div>

        <!-- Daily Controls Section -->
        <div class="daily-controls">
            <button type="button" class="daily-income-btn" id="dailyIncomeBtn">daily income</button>
            <div class="date-box">
                <label for="saleDate">date of sale:</label>
                <input type="date" id="saleDate">
            </div>
        </div>

        <!-- Daily Order Area -->
        <div class="daily-order-box" id="dailyOrderDisplay">
            <div style="text-align: center; color: #555;">Loading daily orders...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ မိမိတို့၏ Firebase Config ဖြင့် အစားထိုးပါ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('saleDate').valueAsDate = new Date();

        // 1. Food သစ်ထည့်ခြင်း
        document.getElementById('addFoodForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('foodName').value;
            const price = parseFloat(document.getElementById('foodPrice').value);
            const category = document.getElementById('foodCategory').value;
            const image = document.getElementById('foodImage').value || 'https://via.placeholder.com/40';

            push(ref(db, 'foods'), { name, price, category, image }).then(() => {
                document.getElementById('addFoodForm').reset();
            });
        });

        // 2. Food List ပြခြင်း
        onValue(ref(db, 'foods'), (snapshot) => {
            const tbody = document.getElementById('menuTableBody');
            tbody.innerHTML = '';
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach((key) => {
                    const item = data[key];
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${item.image}" onerror="this.src='https://via.placeholder.com/40'"></td>
                            <td>${item.name}</td>
                            <td>${item.category}</td>
                            <td>$${parseFloat(item.price).toFixed(2)}</td>
                        </tr>
                    `;
                });
            }
        });

        // 3. Orders & Total Income ပြခြင်း
        onValue(ref(db, 'orders'), (snapshot) => {
            const orderDisplay = document.getElementById('dailyOrderDisplay');
            let totalIncome = 0;
            orderDisplay.innerHTML = '';

            if (snapshot.exists()) {
                const orders = snapshot.val();
                Object.keys(orders).forEach((id) => {
                    const order = orders[id];
                    totalIncome += parseFloat(order.totalPrice);
                    orderDisplay.innerHTML += `
                        <div style="border-bottom: 1px solid #ddd; padding: 6px 0; font-size:14px;">
                            <b>ID:</b> ...${id.slice(-5)} | 
                            <b>Amount:</b> $${order.totalPrice.toFixed(2)} | 
                            <b>Status:</b> ${order.status}
                        </div>
                    `;
                });
                document.getElementById('totalIncomeDisplay').innerText = `Total income: $${totalIncome.toFixed(2)}`;
            } else {
                orderDisplay.innerHTML = '<div style="text-align: center; color: #555;">No orders found</div>';
            }
        });
    </script>
</body>
</html>
