<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Smart Restaurant</title>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f1f2f6; padding: 20px; color: #2f3542; }
        .dashboard { max-width: 900px; margin: 0 auto; }
        header { background: #2f3542; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Revenue Section */
        .revenue-card { background: #2ed573; color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; text-align: center; box-shadow: 0 4px 12px rgba(46, 213, 115, 0.3); }
        .revenue-card h2 { font-size: 36px; margin-top: 8px; font-weight: 700; }
        .date-picker-box { margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.2); padding: 8px 15px; border-radius: 8px; width: fit-content; margin-left: auto; margin-right: auto; }
        .date-picker-box input { padding: 6px 12px; border-radius: 6px; border: none; outline: none; font-weight: bold; color: #2f3542; font-size: 14px; }

        /* General Section Box */
        .section-box { background: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size: 20px; color: #2f3542; margin-bottom: 15px; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* Add Menu Form */
        .add-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .add-form input { flex: 1; min-width: 140px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-size: 14px; }
        .add-form input:focus { border-color: #1e90ff; }
        .btn-add { background: #1e90ff; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add:hover { background: #0070e0; }

        /* Table Styling */
        .menu-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .menu-table th, .menu-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        .menu-table th { background: #f8f9fa; color: #2f3542; font-weight: 600; }
        .item-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .btn-delete { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; }
        .btn-delete:hover { background: #e84118; }

        /* Order Cards Styling */
        .order-card { background: #ffffff; border: 1px solid #e1e8ed; border-left: 5px solid #ffa502; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .order-card.finished { border-left-color: #2ed573; }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f2f6; padding-bottom: 8px; margin-bottom: 10px; font-weight: bold; }
        .order-items { margin-bottom: 12px; font-size: 14px; color: #57606f; line-height: 1.5; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #2f3542; border-top: 1px dashed #eee; padding-top: 10px; }
        
        /* Badges & Action Buttons */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; }
        .time-badge { background: #70a1ff; color: white; }
        .payment-badge { background: #eccc68; color: #2f3542; margin-left: 5px; }
        .status-badge { margin-left: 5px; }
        .status-pending { background: #ff7f50; color: white; }
        .status-finished { background: #2ed573; color: white; }

        .btn-status { background: #2ed573; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 5px; }
        .btn-status:hover { background: #26af5f; }
        .btn-delete-order { background: #a4b0be; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete-order:hover { background: #747d8c; }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>Smart Restaurant - Owner Dashboard</h1>
    </header>

    <!-- Revenue Display Box -->
    <div class="revenue-card">
        <small>Total Sales Revenue</small>
        <h2 id="selectedSales">0 MMK</h2>
        <div class="date-picker-box">
            <label for="salesDate"><strong>Select Date:</strong></label>
            <input type="date" id="salesDate" onchange="filterSalesByDate()">
        </div>
    </div>

    <!-- 1. Menu Management Section -->
    <div class="section-box">
        <h2 class="section-title">🍔 Manage Menu Items</h2>
        <form class="add-form" onsubmit="addMenuItem(event)">
            <input type="text" id="itemName" placeholder="Item Name (e.g. Fried Rice)" required>
            <input type="number" id="itemPrice" placeholder="Price (MMK)" required min="0">
            <input type="url" id="itemImage" placeholder="Image URL (https://...)" required>
            <button type="submit" class="btn-add">+ Add Item</button>
        </form>

        <table class="menu-table">
            <thead>
                <tr>
                    <th style="width: 70px;">Image</th>
                    <th>Item Name</th>
                    <th>Price</th>
                    <th style="width: 80px; text-align: center;">Action</th>
                </tr>
            </thead>
            <tbody id="menuContainer">
                <tr><td colspan="4" style="text-align: center; color: #888;">Loading menu items...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 2. Customer Orders History Section -->
    <div class="section-box">
        <h2 class="section-title">
            🛒 Orders Record (<span id="displayDateLabel">Today</span>)
        </h2>
        <div id="ordersContainer">
            <p style="text-align: center; color: #777;">Loading sales data...</p>
        </div>
    </div>
</div>

<script>
    // 1. Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAV_3fSOQDigao1MDeZ12V734yqqHBKSDw",
        authDomain: "smart-restaurant-85871.firebaseapp.com",
        projectId: "smart-restaurant-85871",
        storageBucket: "smart-restaurant-85871.firebasestorage.app",
        messagingSenderId: "909399970300",
        appId: "1:909399970300:web:8da6c6522af7b1a6296279"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // DOM Elements
    const ordersContainer = document.getElementById('ordersContainer');
    const selectedSalesElement = document.getElementById('selectedSales');
    const menuContainer = document.getElementById('menuContainer');
    const salesDateInput = document.getElementById('salesDate');
    const displayDateLabel = document.getElementById('displayDateLabel');

    let allOrders = [];

    // Set default selected date to Today in YYYY-MM-DD
    const today = new Date();
    salesDateInput.value = today.toISOString().split('T')[0];

    // ==========================================
    // MENU MANAGEMENT (Realtime Read, Add, Delete)
    // ==========================================

    // Fetch and display menu items
    db.collection("menu").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        menuContainer.innerHTML = "";
        if (snapshot.empty) {
            menuContainer.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #888;">No menu items found.</td></tr>`;
            return;
        }

        snapshot.forEach(doc => {
            const item = doc.data();
            const defaultImg = "https://via.placeholder.com/50?text=Food";
            menuContainer.innerHTML += `
                <tr>
                    <td><img src="${item.image || defaultImg}" class="item-img" alt="${item.name}" onerror="this.src='${defaultImg}'"></td>
                    <td><strong>${item.name}</strong></td>
                    <td>${Number(item.price).toLocaleString()} MMK</td>
                    <td style="text-align: center;">
                        <button class="btn-delete" onclick="deleteMenuItem('${doc.id}')">Delete</button>
                    </td>
                </tr>
            `;
        });
    }, error => {
        console.error("Error loading menu: ", error);
    });

    // Add new menu item to Firestore
    async function addMenuItem(event) {
        event.preventDefault();
        const nameInput = document.getElementById('itemName');
        const priceInput = document.getElementById('itemPrice');
        const imageInput = document.getElementById('itemImage');

        try {
            await db.collection("menu").add({
                name: nameInput.value.trim(),
                price: Number(priceInput.value),
                image: imageInput.value.trim(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Reset Input Fields
            nameInput.value = ""; 
            priceInput.value = ""; 
            imageInput.value = "";
        } catch (error) {
            console.error("Error adding item: ", error);
            alert("အကြောင်းအရာသစ် ထည့်သွင်းရာတွင် အမှားအယွင်းရှိနေပါသည်။");
        }
    }

    // Delete menu item from Firestore
    async function deleteMenuItem(docId) {
        if (confirm("ဒီ Item ကို တကယ်ဖျက်မှာ သေချာပါသလား?")) {
            try {
                await db.collection("menu").doc(docId).delete();
            } catch (error) {
                console.error("Error deleting item: ", error);
            }
        }
    }

    // ==========================================
    // ORDERS & REVENUE MANAGEMENT (Realtime Read)
    // ==========================================

    // Listen to real-time order updates
    db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        allOrders = [];
        snapshot.forEach(doc => {
            allOrders.push({ id: doc.id, ...doc.data() });
        });
        filterSalesByDate();
    }, error => {
        console.error("Error loading orders: ", error);
        ordersContainer.innerHTML = `<p style='text-align:center; color: red;'>Error loading orders dataset.</p>`;
    });

    // Filter orders and calculate total sales revenue by chosen date
    function filterSalesByDate() {
        const selectedDateStr = salesDateInput.value;
        if (!selectedDateStr) return;

        let totalRevenue = 0;
        ordersContainer.innerHTML = "";
        displayDateLabel.innerText = selectedDateStr;

        // Filter logic comparing local date string (YYYY-MM-DD)
        const filteredOrders = allOrders.filter(order => {
            const createdAt = order.timestamp || order.createdAt;
            if (createdAt && typeof createdAt.toDate === 'function') {
                const dateObj = createdAt.toDate();
                // Format date object to YYYY-MM-DD string format safely
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                const formattedDate = `${year}-${month}-${day}`;
                
                return formattedDate === selectedDateStr;
            }
            return false;
        });

        if (filteredOrders.length === 0) {
            ordersContainer.innerHTML = `<p style='text-align:center; color: #777; padding: 20px;'>No orders found on ${selectedDateStr}.</p>`;
            selectedSalesElement.innerText = "0 MMK";
            return;
        }

        filteredOrders.forEach(order => {
            const orderTotal = Number(order.total || 0);
            const createdAt = order.timestamp || order.createdAt;
            
            let orderTime = "";
            if (createdAt && typeof createdAt.toDate === 'function') {
                orderTime = createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            // Accumulate Revenue Total
            totalRevenue += orderTotal;

            // Map Order Items
            let itemsText = (order.items && Array.isArray(order.items)) 
                ? order.items.map(i => `${i.name} <strong>(x${i.quantity})</strong>`).join(", ") 
                : "No items listed";

            const isFinished = (order.status === 'Finished' || order.status === 'Completed');
            const statusClass = isFinished ? 'status-finished' : 'status-pending';
            const orderStatus = order.status || 'Pending';

            ordersContainer.innerHTML += `
                <div class="order-card ${isFinished ? 'finished' : ''}">
                    <div class="order-header">
                        <span>
                            Table ${order.table || 'N/A'} 
                            <span class="badge payment-badge">${order.paymentMethod || 'Cash'}</span>
                            <span class="badge status-badge ${statusClass}">${orderStatus}</span>
                        </span>
                        <span class="badge time-badge">${orderTime}</span>
                    </div>
                    <div class="order-items">
                        <strong>Items:</strong> ${itemsText}
                    </div>
                    <div class="order-footer">
                        <div>
                            ${!isFinished ? `<button class="btn-status" onclick="markAsFinished('${order.id}')">✓ Mark Finished</button>` : ''}
                            <button class="btn-delete-order" onclick="deleteOrder('${order.id}')">Delete Order</button>
                        </div>
                        <div>
                            <small style="color: #777; font-weight: normal;">Amount: </small>
                            <span style="color: #2ed573; font-size: 16px;">${orderTotal.toLocaleString()} MMK</span>
                        </div>
                    </div>
                </div>
            `;
        });

        // Display Total Sales Revenue
        selectedSalesElement.innerText = `${totalRevenue.toLocaleString()} MMK`;
    }

    // Toggle Order Status to Finished
    async function markAsFinished(orderId) {
        try {
            await db.collection("orders").doc(orderId).update({
                status: "Finished"
            });
        } catch (error) {
            console.error("Error updating order status: ", error);
        }
    }

    // Delete an order
    async function deleteOrder(orderId) {
        if (confirm("ဒီ Order ရာဇဝင်ကို ဖျက်မှာ သေချာပါသလား?")) {
            try {
                await db.collection("orders").doc(orderId).delete();
            } catch (error) {
                console.error("Error deleting order: ", error);
            }
        }
    }
</script>

</body>
</html>
