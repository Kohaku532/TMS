<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Smart Restaurant</title>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f1f2f6; padding: 20px; }
        .dashboard { max-width: 800px; margin: 0 auto; }
        header { background: #2f3542; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .revenue-card { background: #2ed573; color: white; padding: 20px; border-radius: 12px; font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .revenue-card small { display: block; font-size: 14px; opacity: 0.9; font-weight: normal; }
        .order-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; font-weight: bold; }
        .order-items { margin-bottom: 10px; font-size: 14px; color: #57606f; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #ff4757; }
        .status-badge { background: #ffa502; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>Owner Dashboard</h1>
    </header>

    <!-- တစ်ရက်စာ ဝင်ငွေ ပြသသည့် ကတ် -->
    <div class="revenue-card">
        <small>Today's Sales Revenue</small>
        <span id="todaySales">0 MMK</span>
    </div>

    <h3>Recent Customer Orders</h3>
    <br>
    <!-- Order စာရင်းများ ပေါ်လာမည့်နေရာ -->
    <div id="ordersContainer">
        <p style="text-align: center; color: #777;">Loading sales data...</p>
    </div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = {
        apiKey: "AIzaSyAV_3fSOQDigao1MDeZ12V734yqqHBKSDw",
        authDomain: "smart-restaurant-85871.firebaseapp.com",
        projectId: "smart-restaurant-85871",
        storageBucket: "smart-restaurant-85871.firebasestorage.app",
        messagingSenderId: "909399970300",
        appId: "1:909399970300:web:8da6c6522af7b1a6296279"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ordersContainer = document.getElementById('ordersContainer');
    const todaySalesElement = document.getElementById('todaySales');

    // Firestore မှ Order များနှင့် Sales များကို Real-Time ဖတ်ယူခြင်း
    db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        ordersContainer.innerHTML = "";
        let todayTotal = 0;

        // ဒီနေ့ ရက်စွဲကို ယူခြင်း (YYYY-MM-DD)
        const now = new Date();
        const todayString = now.toDateString(); 

        if (snapshot.empty) {
            ordersContainer.innerHTML = "<p style='text-align:center;'>No orders found.</p>";
            todaySalesElement.innerText = "0 MMK";
            return;
        }

        snapshot.forEach(doc => {
            const order = doc.data();
            
            // Order တင်သည့်အချိန်တွက်ချက်ခြင်း
            let orderTime = "Just now";
            let orderDateString = "";
            if (order.createdAt) {
                const dateObj = order.createdAt.toDate();
                orderTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                orderDateString = dateObj.toDateString();
            }

            // ဒီနေ့ တင်ထားသော Order ဖြစ်ပါက တစ်ရက်စာ ဝင်ငွေထဲ ပေါင်းထည့်မည်
            if (orderDateString === todayString) {
                todayTotal += Number(order.totalAmount || 0);
            }

            // Item စာရင်းများကို Text စာသားအဖြစ် ပြောင်းခြင်း
            let itemsText = "";
            if (order.items && Array.isArray(order.items)) {
                itemsText = order.items.map(i => `${i.name} (x${i.quantity})`).join(", ");
            }

            // UI တည်ဆောက်ခြင်း
            ordersContainer.innerHTML += `
                <div class="order-card">
                    <div class="order-header">
                        <span>Table ${order.tableNumber || 'N/A'}</span>
                        <span class="status-badge">${orderTime}</span>
                    </div>
                    <div class="order-items">
                        <strong>Items:</strong> ${itemsText}
                    </div>
                    <div class="order-footer">
                        <span>Total:</span>
                        <span>${Number(order.totalAmount || 0).toLocaleString()} MMK</span>
                    </div>
                </div>
            `;
        });

        // ဒီနေ့အတွက် ဝင်ငွေ စုစုပေါင်းကို Display တင်ပေးခြင်း
        todaySalesElement.innerText = `${todayTotal.toLocaleString()} MMK`;
    }, error => {
        console.error("Firestore Error: ", error);
        ordersContainer.innerHTML = "<p style='color:red; text-align:center;'>Error loading sales data. Check Database Rules.</p>";
    });
</script>

</body>
</html>
