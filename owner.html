<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner View - Firebase Connected</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background-color: #ffffff;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-box, .income-box {
            border: 2px solid #000;
            border-radius: 30px;
            padding: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background-color: #fff;
        }

        .add-form {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-form input {
            flex: 1;
            min-width: 100px;
            border: 2px solid #000;
            border-radius: 4px;
            padding: 8px;
            font-size: 14px;
            outline: none;
        }

        .add-btn {
            border: 2px solid #000;
            border-radius: 20px;
            padding: 8px 18px;
            background-color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background-color: #eee;
        }

        .food-display {
            border: 2px solid #000;
            min-height: 180px;
            max-height: 250px;
            overflow-y: auto;
            padding: 12px;
            border-radius: 4px;
            background-color: #fff;
        }

        .menu-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .menu-table th, .menu-table td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .menu-table img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .daily-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .daily-income-btn {
            border: 2px solid #000;
            padding: 10px 16px;
            border-radius: 4px;
            background-color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .date-box {
            flex: 1;
            border: 2px solid #000;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .date-box input[type="date"] {
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            cursor: pointer;
        }

        .daily-order-box {
            border: 2px solid #000;
            min-height: 120px;
            border-radius: 4px;
            padding: 16px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">Owner View</div>
        <div class="income-box" id="totalIncomeDisplay">Total income: $0.00</div>

        <!-- Add Food Form -->
        <form class="add-form" id="addFoodForm">
            <input type="text" id="foodName" placeholder="food" required>
            <input type="number" id="foodPrice" placeholder="price" step="0.01" required>
            <input type="text" id="foodCategory" placeholder="categori" required>
            <input type="text" id="foodImage" placeholder="image (URL)">
            <button type="submit" class="add-btn">+Add</button>
        </form>

        <!-- Main Display Box -->
        <div class="food-display">
            <table class="menu-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Food</th>
                        <th>Category</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="menuTableBody">
                    <!-- Firebase Realtime Data ဤနေရာတွင် ပေါ်မည် -->
                </tbody>
            </table>
        </div>

        <!-- Daily Controls Section -->
        <div class="daily-controls">
            <button type="button" class="daily-income-btn" id="dailyIncomeBtn">daily income</button>
            <div class="date-box">
                <label for="saleDate">date of sale:</label>
                <input type="date" id="saleDate">
            </div>
        </div>

        <!-- Daily Order Area -->
        <div class="daily-order-box" id="dailyOrderDisplay">
            <div style="text-align: center; color: #555;">daily order</div>
        </div>
    </div>

    <!-- Firebase Script (Realtime Database) -->
    <script type="module">
        // Firebase App & Database Modules မာယူခြင်း
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 1. သင့် Firebase Console မှ Config အချက်အလက်များဖြင့် အစားထိုးပါ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase ကို စတင်ခြင်း
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // HTML Elements
        const addFoodForm = document.getElementById('addFoodForm');
        const menuTableBody = document.getElementById('menuTableBody');
        const saleDateInput = document.getElementById('saleDate');

        // Today Date သတ်မှတ်ခြင်း
        saleDateInput.valueAsDate = new Date();

        // 2. Data သစ်ထည့်ခြင်း (Create/Push)
        addFoodForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('foodName').value;
            const price = parseFloat(document.getElementById('foodPrice').value);
            const category = document.getElementById('foodCategory').value;
            const image = document.getElementById('foodImage').value || 'https://via.placeholder.com/40';

            // Realtime Database ထဲသို့ 'foods' node အောက်တွင် Data လှမ်းထည့်ခြင်း
            const foodRef = ref(db, 'foods');
            push(foodRef, {
                name: name,
                price: price,
                category: category,
                image: image,
                createdAt: new Date().toISOString()
            }).then(() => {
                addFoodForm.reset();
            }).catch((error) => {
                console.error("Data သိမ်းဆည်းရာတွင် အမှားရှိသည်:", error);
            });
        });

        // 3. Realtime Database မှ Data များ ပြန်ဖတ်ခြင်း (Read in Realtime)
        const foodsRef = ref(db, 'foods');
        onValue(foodsRef, (snapshot) => {
            menuTableBody.innerHTML = ''; // Table ကို ရှင်းထုတ်ခြင်း
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                Object.keys(data).forEach((key) => {
                    const item = data[key];
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/40'"></td>
                        <td>${item.name}</td>
                        <td>${item.category}</td>
                        <td>$${item.price.toFixed(2)}</td>
                    `;
                    menuTableBody.appendChild(row);
                });
            } else {
                menuTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No items found</td></tr>';
            }
        });
    </script>
</body>
</html>
